name: Sync fork with upstream

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/coreyhaines31/marketingskills.git

      - name: Fetch upstream
        run: git fetch upstream

      - name: Merge upstream/main (fast-forward only)
        run: |
          git checkout main
          if git merge --ff-only upstream/main; then
            echo "Fast-forward merge succeeded."
          else
            echo "Fast-forward merge failed - fork has diverged. Manual sync required."
            exit 1
          fi

      - name: Push to fork
        run: git push origin main
